name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: botops
          POSTGRES_PASSWORD: botops
          POSTGRES_DB: botops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U botops"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://botops:botops@localhost:5432/botops
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run db:generate --workspace=api

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      - run: npm run build
